<text x="150.0" y="270.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">register, login</text>
<rect x="340" y="60" width="380" height="300" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="530.0" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">auth-api</text>
<text x="530.0" y="110.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">JwtProvider (HS384) +</text>
<text x="530.0" y="127.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">Argon2PasswordEncoder</text>
<text x="530.0" y="144.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563"></text>
<text x="530.0" y="161.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">validate credentials,</text>
<text x="530.0" y="178.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">hash / verify password</text>
<text x="530.0" y="195.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563"></text>
<text x="530.0" y="212.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">publishes UserRegistered /</text>
<text x="530.0" y="229.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">UserUpdated / UserDeleted /</text>
<text x="530.0" y="246.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">TokenRevoked</text>
<rect x="820" y="40" width="340" height="90" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="990.0" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Response</text>
<text x="990.0" y="90.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">UserResponse — register</text>
<rect x="820" y="160" width="340" height="90" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="990.0" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Response</text>
<text x="990.0" y="210.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">AccessTokenResponse — login</text>
<rect x="340" y="420" width="380" height="180" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="530.0" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Redis</text>
<text x="530.0" y="470.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">UserCacheService /</text>
<text x="530.0" y="487.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">RevokedTokenCacheService</text>
<text x="530.0" y="504.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">cache-aside, TTL 30 min</text>
<text x="530.0" y="521.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">read-your-writes before</text>
<text x="530.0" y="538.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">Postgres ever sees it</text>
<rect x="820" y="330" width="340" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="990.0" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Kafka</text>
<text x="990.0" y="380.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">topic: auth-events</text>
<rect x="820" y="470" width="340" height="130" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="990.0" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">AuthEventWorker</text>
<text x="990.0" y="520.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">in-process @KafkaListener —</text>
<text x="990.0" y="537.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">same JVM as auth-api,</text>
<text x="990.0" y="554.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">not a separate deployable</text>
<rect x="340" y="680" width="820" height="100" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="750.0" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Postgres</text>
<text x="750.0" y="730.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">auth_api schema: users, revoked_tokens  ·  sole writer: AuthEventWorker</text>
