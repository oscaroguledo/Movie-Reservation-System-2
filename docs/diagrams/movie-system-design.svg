<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" width="1560" height="900">
<title>movie-api system design</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8891a0"/></marker></defs>
<rect x="1" y="1" width="1558" height="898" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="20" width="280" height="100" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4" stroke-dasharray="7,5"/>
<text x="200.0" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">auth-api</text>
<text x="200.0" y="70.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">external service, issues JWT</text>
<rect x="60" y="180" width="280" height="100" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="200.0" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Client</text>
<text x="200.0" y="230.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">browses, reserves, cancels</text>
<rect x="420" y="20" width="420" height="380" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="630.0" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">movie-api</text>
<text x="630.0" y="70" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">JwtPrincipalFilter: verify JWT</text>
<text x="630.0" y="87" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">(HS256, shared secret) — guest</text>
<text x="630.0" y="104" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">by default, no revocation check</text>
<text x="630.0" y="121" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563"></text>
<text x="630.0" y="138" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">genre / movie / showroom /</text>
<text x="630.0" y="155" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">screening CRUD</text>
<text x="630.0" y="172" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">reservation hold (rate-limited)</text>
<text x="630.0" y="189" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">/ confirm / cancel</text>
<text x="630.0" y="206" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">payment charge / refund on</text>
<text x="630.0" y="223" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">confirm / cancel</text>
<text x="630.0" y="240" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">admin: reservations, capacity,</text>
<text x="630.0" y="257" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">revenue</text>
<text x="630.0" y="274" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563"></text>
<text x="630.0" y="291" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">GET /health — static liveness</text>
<text x="630.0" y="308" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">GET /actuator/health — Postgres</text>
<text x="630.0" y="325" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#4b5563">+ Redis reachability detail</text>
<rect x="940" y="10" width="340" height="80" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="1110.0" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Response</text>
<text x="1110.0" y="60.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">genres / movies / screenings / seat map</text>
<rect x="940" y="120" width="340" height="90" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="1110.0" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Response</text>
<text x="1110.0" y="170.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">reservation / payment</text>
<text x="1110.0" y="187.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">(guests allowed to hold)</text>
<rect x="940" y="240" width="340" height="80" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="1110.0" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Response</text>
<text x="1110.0" y="290.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">admin: reservations, capacity, revenue</text>
<rect x="420" y="440" width="420" height="220" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="630.0" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Redis</text>
<text x="630.0" y="489.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">EntityCacheService: TTL =</text>
<text x="630.0" y="505.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">entity-cache-ttl-seconds</text>
<text x="630.0" y="520.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">SeatLockService.acquireSeat:</text>
<text x="630.0" y="536.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">SETNX, TTL = hold-ttl-seconds</text>
<text x="630.0" y="551.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">  -&gt; the overbooking guard</text>
<text x="630.0" y="567.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">ScreeningCacheService.lockSchedule:</text>
<text x="630.0" y="582.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">SETNX, TTL = 5s -&gt; overlap guard</text>
<text x="630.0" y="598.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">ReservationCacheService: no TTL</text>
<text x="630.0" y="613.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">(Postgres lags)</text>
<rect x="940" y="350" width="340" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="1110.0" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Kafka</text>
<text x="1110.0" y="400.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#4b5563">topic: movie-events</text>
<rect x="940" y="480" width="340" height="180" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="1110.0" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">MovieEventWorker</text>
<text x="1110.0" y="529.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">in-process @KafkaListener —</text>
<text x="1110.0" y="545.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">same JVM as movie-api,</text>
<text x="1110.0" y="560.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">not a separate deployable</text>
<text x="1110.0" y="576.3" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">idempotent: redelivering an</text>
<text x="1110.0" y="591.8" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.8" fill="#4b5563">already-applied write is a no-op</text>
<rect x="60" y="700" width="1220" height="150" rx="12" fill="#eef1f5" stroke="#c7cfd6" stroke-width="1.4"/>
<text x="670.0" y="730" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Postgres</text>
<text x="670.0" y="750.2" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.2" fill="#4b5563">movie_api schema: genres, movies, showrooms, seats, screenings, reservations, payments</text>
<text x="670.0" y="769.2" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.2" fill="#4b5563">fallback read on cache miss  ·  sole writer: MovieEventWorker</text>
