# Local dev stack for auth-api + movie-api.
#
# Both services share one Postgres database (matching the Python
# reference's own shape — a single "movie_reservation"-style database
# with auth_api/movie_api namespaced as separate schemas within it, not
# two separate databases). Each service's Flyway migration only ever
# touches its own schema (spring.flyway.schemas), so the two stay
# cleanly separated despite sharing one connection target.
#
# Each service's Kafka worker (AuthEventWorker / MovieEventWorker) runs
# in-process rather than as a separate container — unlike the Python
# reference's standalone worker.py, it's just a @KafkaListener component
# in the same Spring app. Splitting either into its own container later
# would mean adding a "worker-only" Spring profile that disables the web
# server, without touching any event-handling code.
#
# Flyway migrates each schema on application startup (Spring Boot's
# default behavior), so there's no separate one-shot migration container.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_api}
      POSTGRES_USER: ${POSTGRES_USER:-auth_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_api} -d ${POSTGRES_DB:-auth_api}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # Host port 6380, not 6379: this stack is meant to run alongside
      # the Python reference implementation's own compose stack on the
      # same machine without a port clash.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: auth-api/Dockerfile
    ports:
      # Host port 8010, not 8000: avoids clashing with the Python
      # reference implementation's auth-api if both stacks run at once.
      - "8010:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-auth_api}
      DB_USER: ${POSTGRES_USER:-auth_api}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set — copy .env.example to .env}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-30}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_FIRST_NAME: ${INITIAL_ADMIN_FIRST_NAME:-Admin}
      INITIAL_ADMIN_LAST_NAME: ${INITIAL_ADMIN_LAST_NAME:-User}
      REVOKED_TOKEN_CLEANUP_INTERVAL_SECONDS: ${REVOKED_TOKEN_CLEANUP_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  movie-api:
    build:
      context: .
      dockerfile: movie-api/Dockerfile
    ports:
      # Host port 8011, not 8001: avoids clashing with the Python
      # reference implementation's movie-api if both stacks run at once.
      - "8011:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Same physical database as auth-api — see the file header comment.
      DB_NAME: ${POSTGRES_DB:-auth_api}
      DB_USER: ${POSTGRES_USER:-auth_api}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Same secret as auth-api — movie-api validates the JWTs auth-api
      # issues, it doesn't issue its own.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set — copy .env.example to .env}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-30}
      ENTITY_CACHE_TTL_SECONDS: ${ENTITY_CACHE_TTL_SECONDS:-3600}
      RESERVATION_RATE_LIMIT_MAX_REQUESTS: ${RESERVATION_RATE_LIMIT_MAX_REQUESTS:-20}
      RESERVATION_RATE_LIMIT_WINDOW_SECONDS: ${RESERVATION_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
