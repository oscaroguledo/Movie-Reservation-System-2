spring:
  application:
    name: auth-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_api}
    username: ${DB_USER:auth_api}
    password: ${DB_PASSWORD:auth_api}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches the
      # entity mappings at startup, mirroring the Python side's
      # "no runtime schema creation" rule (Alembic-only there).
      ddl-auto: validate

  flyway:
    schemas: auth_api
    default-schema: auth_api

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-api-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: auth.event

server:
  port: 8080

management:
  endpoint:
    health:
      # Surfaces per-dependency status (Postgres, Redis, Kafka — each
      # auto-configured for free once their starters are on the
      # classpath) at /actuator/health, matching the Python reference's
      # /health doing a real "SELECT 1" against Postgres rather than a
      # bare liveness stub. /actuator/** is permitAll in SecurityConfig,
      # same as /health, so "always" (not "when-authorized") is right.
      show-details: always

auth:
  jwt:
    # Must be overridden in any non-local environment.
    secret: ${JWT_SECRET_KEY:dev-only-insecure-secret-change-me-32-bytes-min}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
  rate-limit:
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  # InitialAdminSeeder bootstraps this account on startup when both email
  # and password are set — the only way to get a first admin, since every
  # admin-management endpoint otherwise requires one to already exist.
  # Leave blank (the default) to skip seeding.
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    first-name: ${INITIAL_ADMIN_FIRST_NAME:Admin}
    last-name: ${INITIAL_ADMIN_LAST_NAME:User}
  # RevokedTokenCleanupTask's fixed-delay purge interval.
  revoked-token-cleanup:
    interval-seconds: ${REVOKED_TOKEN_CLEANUP_INTERVAL_SECONDS:3600}
